name: second-workflow
on: push

jobs:
    second-job:
      runs-on: ubuntu-latest
      needs: first-job
      steps:
            - name: checkout
              uses: actions/checkout@v7
            - name: welcome message
              run: echo "hello mohab"
            - name: list files
              run: ls
            - name: read readme file
              run: cat README.md
            - name: multiple
              run: |
                ls
                cat README.md

    first-job:
      runs-on: ubuntu-24.04
      steps:
            - name: checkout
              uses: actions/checkout@v7
            - name: executing shell
              run: |
                chmod +x new.sh
                ./new.sh
