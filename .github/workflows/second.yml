name: second-workflow
on: push

jobs:
    second-job:
      runs-on: ubuntu-latest
      needs: first-job
      steps:
            - name: checkout
              uses: actions/checkout@v7
            - name: welcome message
              run: echo "hello mohab"
            - name: list files
              run: ls
            - name: create file
              run: touch new.txt
            - name: multiple
              run: |
                ls
                cat README.md
            - name: upload artifact
              uses: actions/upload-artifact@v7
              with:
                name: uploaded-file
                path: new.txt

    first-job:
      runs-on: ubuntu-24.04
      steps:
            - name: checkout
              uses: actions/checkout@v7
            - name: executing shell
              run: |
                chmod +x new.sh
                ./new.sh
            - name: download artifact
              uses: actions/download-artifact@v8
              with:
                name: uploaded-file
